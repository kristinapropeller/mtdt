<!-- Confirmation Modal -->
<template>
    <lightning-modal-header label={header}></lightning-modal-header>
    <lightning-modal-body>{content}</lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button variant="neutral" label={secondaryButton} onclick={handleSecondary}></lightning-button>
        <lightning-button variant="brand" label={primaryButton} onclick={handlePrimary} class="slds-m-left_x-small"></lightning-button>
    </lightning-modal-footer>
</template>
