<!-- Utilization Booking Modal -->
<template>
    <lightning-modal-header label={header}></lightning-modal-header>
    <lightning-modal-body>
        <template if:false={recordId}>
            <lightning-radio-group name="bookingType"
                                   label="Type"
                                   options={typeOptions}
                                   value={bookingType}
                                   type="button"
                                   onchange={handleTypeChange}></lightning-radio-group>
        </template>
        <template if:true={isBooking}>
            <lightning-record-edit-form record-id={recordId}
                                        object-api-name="Booking__c"
                                        onsuccess={handleSaveSuccess}
                                        onerror={handleSaveError}>
                <lightning-messages></lightning-messages>
                <lightning-input-field field-name="Contact__c" value={contactId} disabled></lightning-input-field>
                <lightning-input-field field-name="Project__c"></lightning-input-field>
                <lightning-input-field field-name="Name" required></lightning-input-field>
                <lightning-input-field field-name="Start_Date__c" required></lightning-input-field>
                <lightning-input-field field-name="End_Date__c" required></lightning-input-field>
                <lightning-input-field field-name="Planned_Time__c" required></lightning-input-field>
            </lightning-record-edit-form>
        </template>
        <template if:true={isVacation}>
            <lightning-record-edit-form record-id={recordId}
                                        object-api-name="Vacation__c"
                                        onsuccess={handleSaveSuccess}
                                        onerror={handleSaveError}>
                <lightning-messages></lightning-messages>
                <lightning-input-field field-name="Employee__c" value={contactId} disabled></lightning-input-field>
                <lightning-input-field field-name="Vacation_Type__c" required></lightning-input-field>
                <lightning-input-field field-name="Vacation_Start_Date__c" required></lightning-input-field>
                <lightning-input-field field-name="Vacation_End_Date__c" required></lightning-input-field>
                <lightning-input-field field-name="Status__c"></lightning-input-field>
            </lightning-record-edit-form>
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button variant="brand" label="Save" onclick={handleSave} class="slds-m-left_x-small"></lightning-button>
    </lightning-modal-footer>
</template>
